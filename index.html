<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./assets/favicon.svg" sizes="192x192" />
    <link rel="apple-touch-icon" href="./assets/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" vite-ignore />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>No Ground</title>
  </head>
  <body>
    <div id="game-shell">
      <canvas id="game" aria-label="No Ground game canvas" role="img"></canvas>
      <div id="mobile-controls" aria-hidden="true">
        <button class="control-btn control-btn--pause" type="button" data-control="pause" aria-label="Pause">
          <svg viewBox="0 0 80 80" aria-hidden="true">
            <rect x="24" y="20" width="10" height="40" />
            <rect x="46" y="20" width="10" height="40" />
          </svg>
        </button>
        <div class="control-cluster left">
          <div class="control-column">
            <div class="control-row">
              <button class="control-btn control-btn--left" type="button" data-control="slowfall" data-label="SLOWFALL" aria-label="Slowfall">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                  <!-- Slowfall pictogram: halo ring + lift -->
                  <rect x="28" y="44" width="4" height="4" />
                  <rect x="32" y="40" width="4" height="4" />
                  <rect x="36" y="36" width="4" height="4" />
                  <rect x="40" y="36" width="4" height="4" />
                  <rect x="44" y="40" width="4" height="4" />
                  <rect x="48" y="44" width="4" height="4" />
                  <rect x="44" y="48" width="4" height="4" />
                  <rect x="40" y="48" width="4" height="4" />
                  <rect x="36" y="48" width="4" height="4" />
                  <rect x="32" y="48" width="4" height="4" />
                  <rect x="36" y="28" width="4" height="4" />
                  <rect x="40" y="24" width="4" height="4" />
                  <rect x="44" y="28" width="4" height="4" />
                </svg>
              </button>
              <button class="control-btn control-btn--left" type="button" data-control="dash" data-label="DASH" aria-label="Dash">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                  <!-- Dash pictogram: long forward arrow + streaks -->
                  <rect x="44" y="28" width="4" height="4" />
                  <rect x="48" y="32" width="4" height="4" />
                  <rect x="52" y="36" width="4" height="4" />
                  <rect x="56" y="40" width="4" height="4" />
                  <rect x="52" y="44" width="4" height="4" />
                  <rect x="48" y="48" width="4" height="4" />
                  <rect x="44" y="52" width="4" height="4" />
                  <rect x="36" y="40" width="4" height="4" />
                  <rect x="32" y="40" width="4" height="4" />
                  <rect x="28" y="40" width="4" height="4" />
                  <rect x="20" y="30" width="4" height="4" />
                  <rect x="16" y="30" width="4" height="4" />
                  <rect x="12" y="30" width="4" height="4" />
                  <rect x="24" y="40" width="4" height="4" />
                  <rect x="20" y="40" width="4" height="4" />
                  <rect x="16" y="40" width="4" height="4" />
                  <rect x="24" y="50" width="4" height="4" />
                  <rect x="20" y="50" width="4" height="4" />
                  <rect x="16" y="50" width="4" height="4" />
                  <rect x="12" y="50" width="4" height="4" />
                </svg>
              </button>
            </div>
            <div class="control-row">
              <div class="control-spacer" aria-hidden="true"></div>
              <button class="control-btn control-btn--left control-btn--mini" type="button" data-control="backflip" data-label="BACKFLIP" aria-label="Backflip">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                  <!-- Backflip pictogram: minimal arc -->
                  <rect x="16" y="52" width="4" height="4" />
                  <rect x="28" y="44" width="4" height="4" />
                  <rect x="40" y="38" width="4" height="4" />
                  <rect x="52" y="44" width="4" height="4" />
                  <rect x="64" y="52" width="4" height="4" />
                  <rect x="40" y="24" width="4" height="4" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="control-cluster right">
          <button class="control-btn control-btn--jump" type="button" data-control="jump" data-label="JUMP" aria-label="Jump">
            <svg viewBox="0 0 80 80" aria-hidden="true">
              <rect x="38" y="26" width="4" height="4" />
              <rect x="34" y="30" width="4" height="4" />
              <rect x="38" y="30" width="4" height="4" />
              <rect x="42" y="30" width="4" height="4" />
              <rect x="30" y="34" width="4" height="4" />
              <rect x="34" y="34" width="4" height="4" />
              <rect x="38" y="34" width="4" height="4" />
              <rect x="42" y="34" width="4" height="4" />
              <rect x="46" y="34" width="4" height="4" />
              <rect x="26" y="38" width="4" height="4" />
              <rect x="30" y="38" width="4" height="4" />
              <rect x="34" y="38" width="4" height="4" />
              <rect x="38" y="38" width="4" height="4" />
              <rect x="42" y="38" width="4" height="4" />
              <rect x="46" y="38" width="4" height="4" />
              <rect x="50" y="38" width="4" height="4" />
              <rect x="22" y="42" width="4" height="4" />
              <rect x="26" y="42" width="4" height="4" />
              <rect x="30" y="42" width="4" height="4" />
              <rect x="34" y="42" width="4" height="4" />
              <rect x="38" y="42" width="4" height="4" />
              <rect x="42" y="42" width="4" height="4" />
              <rect x="46" y="42" width="4" height="4" />
              <rect x="50" y="42" width="4" height="4" />
              <rect x="54" y="42" width="4" height="4" />
              <rect x="18" y="46" width="4" height="4" />
              <rect x="22" y="46" width="4" height="4" />
              <rect x="26" y="46" width="4" height="4" />
              <rect x="30" y="46" width="4" height="4" />
              <rect x="34" y="46" width="4" height="4" />
              <rect x="38" y="46" width="4" height="4" />
              <rect x="42" y="46" width="4" height="4" />
              <rect x="46" y="46" width="4" height="4" />
              <rect x="50" y="46" width="4" height="4" />
              <rect x="54" y="46" width="4" height="4" />
              <rect x="58" y="46" width="4" height="4" />
            </svg>
          </button>
          <button class="control-btn control-btn--left control-btn--small" type="button" data-control="dive" data-label="DUCK/DIVE" aria-label="Duck or dive">
            <svg viewBox="0 0 80 80" aria-hidden="true">
              <rect x="18" y="30" width="4" height="4" />
              <rect x="22" y="30" width="4" height="4" />
              <rect x="26" y="30" width="4" height="4" />
              <rect x="30" y="30" width="4" height="4" />
              <rect x="34" y="30" width="4" height="4" />
              <rect x="38" y="30" width="4" height="4" />
              <rect x="42" y="30" width="4" height="4" />
              <rect x="46" y="30" width="4" height="4" />
              <rect x="50" y="30" width="4" height="4" />
              <rect x="54" y="30" width="4" height="4" />
              <rect x="58" y="30" width="4" height="4" />
              <rect x="22" y="34" width="4" height="4" />
              <rect x="26" y="34" width="4" height="4" />
              <rect x="30" y="34" width="4" height="4" />
              <rect x="34" y="34" width="4" height="4" />
              <rect x="38" y="34" width="4" height="4" />
              <rect x="42" y="34" width="4" height="4" />
              <rect x="46" y="34" width="4" height="4" />
              <rect x="50" y="34" width="4" height="4" />
              <rect x="54" y="34" width="4" height="4" />
              <rect x="26" y="38" width="4" height="4" />
              <rect x="30" y="38" width="4" height="4" />
              <rect x="34" y="38" width="4" height="4" />
              <rect x="38" y="38" width="4" height="4" />
              <rect x="42" y="38" width="4" height="4" />
              <rect x="46" y="38" width="4" height="4" />
              <rect x="50" y="38" width="4" height="4" />
              <rect x="30" y="42" width="4" height="4" />
              <rect x="34" y="42" width="4" height="4" />
              <rect x="38" y="42" width="4" height="4" />
              <rect x="42" y="42" width="4" height="4" />
              <rect x="46" y="42" width="4" height="4" />
              <rect x="34" y="46" width="4" height="4" />
              <rect x="38" y="46" width="4" height="4" />
              <rect x="42" y="46" width="4" height="4" />
            </svg>
          </button>
        </div>
      </div>
      <div id="leaderboard-prompt" role="dialog" aria-modal="true">
        <div class="prompt-panel">
          <div class="prompt-title">Claim Top 10</div>
          <p class="prompt-copy">
            Enter a display name (1–10 characters; letters, numbers, space, _ - .)
          </p>
          <input
            id="leaderboard-name-input"
            type="text"
            maxlength="10"
            autocomplete="off"
            aria-label="Leaderboard name"
          />
          <div class="leaderboard-prompt-error" aria-live="polite"></div>
          <div class="prompt-actions">
            <button type="button" data-action="submit">Submit</button>
            <button type="button" data-action="cancel">Skip</button>
          </div>
          <div class="prompt-denied" role="alertdialog" aria-live="assertive" hidden>
            <div class="prompt-denied-title">Access Denied</div>
            <p class="prompt-denied-name"></p>
            <p class="prompt-denied-copy"></p>
            <button type="button" data-action="denied-ok">Try again</button>
          </div>
        </div>
      </div>
    </div>

    <!-- No build step: load the entrypoint directly -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
